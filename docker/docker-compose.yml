services:
  postgres:
    image: postgres:16-alpine
    container_name: smartbcchopp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartbcchopp}
      POSTGRES_USER: ${POSTGRES_USER:-smartbcchopp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartbcchopp} -d ${POSTGRES_DB:-smartbcchopp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: smartbcchopp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: smartbcchopp-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smartbcchopp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smartbcchopp}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-smartbcchopp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smartbcchopp}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: smartbcchopp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOST: api
      API_PORT: 8000
      SERVER_NAME: ${SERVER_NAME:-smartbcchopp.local}
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - api
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  certbot:
    image: certbot/certbot
    container_name: smartbcchopp-certbot
    restart: unless-stopped
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh
    command: >
      -c "while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h;
      done"
    depends_on:
      - nginx
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
    name: smartbcchopp_postgres_data
  redis_data:
    name: smartbcchopp_redis_data
  certbot_data:
    name: smartbcchopp_certbot_data
  certbot_www:
    name: smartbcchopp_certbot_www
